<text x="44" y="522" text-anchor="start">GLOBAL NEXT-STATE CONTROL</text>
<text x="44" y="544" text-anchor="start">G1  ANY STATE except IDLE, FIN -&gt; ENUM_ST_SEQ_ABRT</text>
<text x="44" y="566" text-anchor="start">G2  AAD or PAY -&gt; ENUM_ST_SEQ_SUSP</text>
<text x="44" y="588" text-anchor="start">Highest priority after reset. Fatal errors are LEN_ERR, CTR_EXHAUST, PROTO_ERR and KEY_ERR (side-load wait expired).</text>
<text x="44" y="610" text-anchor="start">Lower priority than G1 and higher than the normal transitions of AAD and PAY.</text>
